<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="flex min-h-screen">

        <aside class="w-64 bg-gray-800 text-white p-6">
            <h2>ADMIN</h2>

            <nav class="flex flex-col gap-5">
                <a href="#" class="text-gray-300 hover:bg-gray-700 p-3">
                    Tableau de bord
                </a>

                <a href="#" class="bg-blue-600 text-white rounded-lg p-3">
                    Categories
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col">

            <header class="flex items-center justify-between bg-white  p-6 shadow-sm border-b">
                HEADER
            </header>

            <main class="flex-1 p-6">
                
                <div class="max-w-5xl mx-auto">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        Nouvelle categorie
                    </button>

                </div>
                <div>                            
                    <label >Nom de la categorie : </label>
                    <input type="text" placeholder="Nom de la categorie" class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <label >Description : </label>
                    <input    type="text"    placeholder="Description"    class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <table class="w-full">
                    <thead class=" bg-gray-50 text-left text-xs text-gray-500 uppercase">
                        <tr >
                            <th>Nom</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b hover:bg-gray-50">
                            <td>Informatique</td>
                            <td>Articles informatiques</td>
                            <td>Modifier</td>
                        </tr>
                        <tr class="border-b hover:bg-gray-50">
                            <td>Sport</td>
                            <td>Articles sportifs</td>
                            <td>Modifier</td>
                        </tr>
                    </tbody>
                </table>


            </main>

        </div>

    </div>

</body>
</html>
